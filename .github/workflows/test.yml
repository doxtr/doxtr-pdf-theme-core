name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build Package
      run: python -m build
    - name: Install package
      run: pip install -e .
    - name: Install test dependencies
      run: pip install pytest
    - name: Run tests
      run: python -m pytest tests/ test_harness/ -v